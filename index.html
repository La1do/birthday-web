<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật Chị Quỳnh Trang 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stars"></div>
<div id="yt"></div>
<button id="mute" type="button" aria-label="Bật/tắt nhạc" hidden>🔊</button>

<section class="screen" id="s1">
  <div class="giftbox" id="gift"><div class="gb-lid"></div><div class="gb-body"></div><div class="glow"></div></div>
  <h1>Có một món quà dành cho Chị Quỳnh Trang</h1>
  <button id="open" type="button">Mở quà</button>
</section>

<section class="screen hide" id="s2">
  <h1>Happy Birthday, Chị Quỳnh Trang! 🎉</h1>
  <div class="stage" id="stage">
    <div class="cake" id="cake">
      <div class="candles" id="candles"></div>
      <div class="layer l2"></div><div class="layer l1"></div><div class="plate"></div>
    </div>
    <div class="reveal" id="reveal">
      <figure class="polaroid" id="photo" hidden><img id="photoImg" alt=""><figcaption id="photoCap"></figcaption></figure>
      <p class="msg" id="msg"><span id="typed"></span><span id="rest"></span></p>
    </div>
  </div>
  <button id="blow" type="button">🕯️ Thổi nến</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
